# Offline with respect to Prior Labs: no job here sets TABPFN_TOKEN or calls
# the TabPFN API. The live smoke test stays a local, human-paced run
# (scripts/smoke_live.py under direnv), one per change. The tests need
# no outbound network: loading expr.py reads nothing, and tests/test_expr.py
# refuses sockets while it loads.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the pinned Python
        run: uv python install

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Style
        # xorq-check-style does not walk directories; it needs the files listed.
        run: git ls-files '*.py' | xargs uv run xorq-check-style

      - name: Offline tests
        run: uv run python -m pytest tests -q
